<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Novara Web · 在线访问">
  <meta name="theme-color" content="#f1eee7">
  <title>Novara Web</title>
  <script>



    (function () {


      var resolve = function (value) {
        var v = String(value || '').toLowerCase();
        if (!v) return null;
        if (v.indexOf('zh') === 0)
          return v.indexOf('tw') >= 0 || v.indexOf('hant') >= 0 || v.indexOf('hk') >= 0 || v.indexOf('mo') >= 0 ? 'zh-TW' : 'zh-CN';
        if (v.indexOf('en') === 0) return 'en-US';
        if (v.indexOf('ko') === 0) return 'ko-KR';
        if (v.indexOf('ja') === 0) return 'ja-JP';
        return null;
      };
      var want = (location.search.match(/[?&]lang=([^&]+)/) || [])[1];
      var nav = navigator.language || 'en-US';
      document.write('<meta name="snapshot-language" content="' + (resolve(want) || resolve(nav) || 'en-US') + '">');
    })();
  </script>
  <link rel="stylesheet" href="viewer.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="editor.css">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

  <div id="unlockView" class="unlock-view" data-view="unlock">
    <section id="unlockCard" class="unlock-card" aria-labelledby="unlockTitle">
      <div class="unlock-brand"><span class="brand-mark" aria-hidden="true"></span><div><div class="wordmark">Novara</div><span class="wordmark-sub">Personal data, under control</span></div></div>
      <h1 id="unlockTitle">Novara Web</h1>
      <p class="unlock-lead" data-i18n="m3Lead"></p>
      <form id="unlockForm" novalidate>
        <div class="m3-field">
          <label class="field-label" for="readTokenInput" data-i18n="m3TokenLabel"></label>
          <input id="readTokenInput" class="password-input m3-token-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-placeholder="m3TokenPlaceholder">
        </div>
        <div class="m3-field">
          <label class="field-label" for="passwordInput" data-i18n="m3PasswordLabel"></label>
          <div class="password-wrap"><input id="passwordInput" class="password-input" type="password" autocomplete="current-password" data-i18n-placeholder="m3PasswordPlaceholder" aria-describedby="unlockError"><button id="passwordToggle" class="password-toggle" type="button" data-i18n-aria="lockShowPassword"><svg class="icon icon-outline" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-5.5 9.5-5.5S21.5 12 21.5 12s-3.3 5.5-9.5 5.5S2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div>
        </div>
        <div id="unlockError" class="unlock-error" role="alert" aria-live="polite"></div>
        <button class="unlock-button" type="submit" data-i18n="m3Unlock"></button>
      </form>
      <div class="unlock-note"><svg class="icon icon-outline" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg><span id="m3Note"></span></div>
    </section>
  </div>

  <div id="appShell" class="app-shell" hidden>
    <header class="titlebar">
      <button id="menuButton" class="titlebar-button" type="button" data-i18n-aria="menuOpen" aria-controls="navDrawer" aria-expanded="false"><svg class="icon icon-outline" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
      <div class="titlebar-brand"><span class="brand-mark" aria-hidden="true"></span><span>Novara Snapshot</span><button id="editUploadButton" class="titlebar-button" type="button" hidden aria-label=""><svg class="icon icon-outline" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>
      
    <button id="editCreateButton" class="titlebar-button" type="button" hidden aria-label=""><svg class="icon icon-outline" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></header>
    <main id="mainContent" class="main-content" aria-live="polite"></main>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="navDrawer" class="nav-drawer" data-i18n-aria="drawerLabel" aria-hidden="true">
    <div class="drawer-head"><div class="drawer-title"><span class="brand-mark" aria-hidden="true"></span><span>Snapshot</span></div><button id="drawerClose" class="drawer-close" type="button" data-i18n-aria="menuClose"><svg class="icon icon-outline" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
    <button id="drawerSearch" class="drawer-search" type="button"><svg class="icon icon-outline" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg><span data-i18n="searchCurrentPage"></span><span style="margin-left:auto;color:var(--text-3);font-size:10px">⌘ K</span></button>
    <div class="drawer-section-label" data-i18n="browse"></div>
    <nav id="drawerNav" class="drawer-nav">
      <button class="drawer-item is-active" data-tab="memo" type="button"><span data-icon="NavMemo"></span><span data-i18n="tabMemo"></span></button>
      <button class="drawer-item" data-tab="path" type="button"><span data-icon="NavFile"></span><span data-i18n="tabPath"></span></button>
      <button class="drawer-item" data-tab="plan" type="button"><span data-icon="NavPlan"></span><span data-i18n="tabPlan"></span></button>
      <button class="drawer-item" data-tab="diary" type="button"><span data-icon="NavDiary"></span><span data-i18n="tabDiary"></span></button>
      <a class="drawer-item" style="margin-top:7px" href="https://novara.xin" target="_blank" rel="noopener noreferrer"><svg class="icon icon-outline" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14.2 14.2 0 0 1 0 18M12 3a14.2 14.2 0 0 0 0 18"></path></svg><span data-i18n="drawerNovaraSite"></span></a>
    <button id="themeToggle" class="drawer-item drawer-theme" type="button" aria-label=""></button></nav>
    <div class="drawer-spacer"></div>
    <div class="drawer-info"><div class="drawer-info-title">Novara Snapshot</div><div id="drawerInfoLine" class="drawer-info-line"></div><div class="drawer-info-line" data-i18n="drawerNote"></div></div>
    <button id="drawerLock" class="drawer-item drawer-lock" type="button"><span data-icon="Lock"></span><span data-i18n="lockSnapshot"></span></button>
  </aside>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="editSyncHint" class="edit-sync-hint" hidden></div>
  <div id="editCreateOverlay" class="edit-conflict" hidden>
    <div class="edit-conflict-card" role="dialog" aria-labelledby="editCreateTitle">
      <h2 id="editCreateTitle"></h2>
      <div class="edit-create-kinds">
        <button class="edit-button edit-kind" type="button" data-editor-kind="memo"></button>
        <button class="edit-button edit-kind" type="button" data-editor-kind="todo"></button>
        <button class="edit-button edit-kind" type="button" data-editor-kind="note"></button>
        <button class="edit-button edit-kind" type="button" data-editor-kind="diary"></button>
      </div>
      <input id="editCreateName" class="edit-input" type="text" autocomplete="off" />
      <input id="editCreateDetail" class="edit-input" type="text" autocomplete="off" />
      <div class="edit-conflict-actions">
        <button id="editCreateSave" class="edit-button is-primary" type="button"></button>
        <button id="editCreateCancel" class="edit-button" type="button"></button>
      </div>
    </div>
  </div>
  <div id="editConflictOverlay" class="edit-conflict" hidden>
    <div class="edit-conflict-card" role="dialog" aria-labelledby="editConflictTitle">
      <h2 id="editConflictTitle"></h2>
      <p id="editConflictInfo"></p>
      <div class="edit-conflict-actions">
        <button id="editConflictExportEnc" class="edit-button is-primary" type="button"></button>
        <button id="editConflictCopy" class="edit-button" type="button"></button>
        <button id="editConflictExportPlain" class="edit-button" type="button"></button>
        <button id="editConflictForce" class="edit-button is-danger" type="button"></button>
        <button id="editConflictAdopt" class="edit-button" type="button"></button>
        <button id="editConflictClose" class="edit-button" type="button"></button>
      </div>
    </div>
  </div>

  <script src="viewer.js"></script>
  <script src="app.js"></script>
  <script src="edit.js"></script>
</body>
</html>
