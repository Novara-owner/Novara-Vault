name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_ROLL_FORWARD: LatestMajor

jobs:

  build-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - name: Restore
        run: dotnet restore Novara.slnx -p:RestoreLockedMode=true
      - name: Build
        run: |
          dotnet build Novara.Core/Novara.Core.csproj -c Release --no-restore
          dotnet build Novara.Sync.Server/Novara.Sync.Server.csproj -c Release --no-restore
          dotnet build Novara.Server/Novara.Server.csproj -c Release --no-restore
      - name: Test
        run: dotnet test Novara.Tests/Novara.Tests.csproj -c Debug --no-restore --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Check coverage
        shell: pwsh
        run: |
          $report = Get-ChildItem -Path coverage -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $report) {
            Write-Error 'No coverage report was produced.'
            exit 1
          }
          [xml]$xml = Get-Content $report.FullName
          $rate = [double]$xml.coverage.'line-rate'
          $percent = [math]::Round($rate * 100, 2)
          Write-Host "Line coverage: $percent%"
          if ($rate -lt 0.80) {
            Write-Error "Line coverage ($percent%) is below the 80% threshold."
            exit 1
          }
          Write-Host 'Line coverage is above the 80% threshold.'

  scan:
    name: Dependency and license audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - name: Restore
        run: dotnet restore Novara.slnx -p:RestoreLockedMode=true
      - name: Audit dependency vulnerabilities
        shell: pwsh
        run: |
          $data = dotnet list Novara.slnx package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $critical = @()
          $high = @()
          $recorded = @()
          foreach ($project in @($data.projects)) {
            foreach ($framework in @($project.frameworks)) {
              foreach ($package in (@($framework.topLevelPackages) + @($framework.transitivePackages))) {
                if ($null -eq $package) { continue }
                foreach ($v in @($package.vulnerabilities)) {
                  if ($null -eq $v) { continue }
                  $line = "$($package.id) $($package.resolvedVersion) [$($v.severity)] $($v.advisoryurl)"
                  if ($v.severity -eq 'Critical') { $critical += $line }
                  elseif ($v.severity -eq 'High') { $high += $line }
                  else { $recorded += $line }
                }
              }
            }
          }
          if ($recorded.Count -gt 0) {
            Write-Host 'Moderate and low severity advisories (recorded):'
            $recorded | ForEach-Object { Write-Host "  $_" }
          }
          if ($high.Count -gt 0) {
            Write-Warning 'High severity advisories require manual review:'
            $high | ForEach-Object { Write-Warning "  $_" }
          }
          if ($critical.Count -gt 0) {
            Write-Error ("Critical vulnerabilities found:`n  " + ($critical -join "`n  "))
            exit 1
          }
          Write-Host 'No critical dependency vulnerabilities.'
      - name: Record outdated packages
        continue-on-error: true
        run: dotnet list Novara.slnx package --outdated
      - name: Audit license inventory
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-project-licenses
          $dir = Join-Path $env:RUNNER_TEMP 'licenses'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          dotnet-project-licenses -i . -m --outfile THIRD_PARTY_LICENSES.md -t --use-project-assets-json -u -f $dir --log-level Warning
          function Get-LicenseRows([string]$text) {
            ($text -split "`n") |
              Where-Object { $_ -match '^\s*\|' } |
              Where-Object { $_ -notmatch '^\s*\|\s*(Reference|-+)' } |
              ForEach-Object { ($_ -replace '\s+', ' ').Trim() } |
              Where-Object { $_ -notmatch 'Microsoft\.NET\.ILLink\.Tasks' } |
              Sort-Object
          }
          $generated = [IO.File]::ReadAllText((Join-Path $dir 'THIRD_PARTY_LICENSES.md'))
          $committed = (git show HEAD:THIRD_PARTY_LICENSES.md | Out-String)
          $delta = Compare-Object (Get-LicenseRows $committed) (Get-LicenseRows $generated)
          if ($delta) {
            $message = ($delta | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }) -join "`n"
            if ($message.Length -gt 3500) { $message = $message.Substring(0, 3500) }
            $encoded = $message.Replace('%', '%25').Replace("`r`n", '%0A').Replace("`n", '%0A')
            Write-Host "::error title=License inventory drift::$encoded"
            exit 1
          }
          Write-Host 'License inventory is current.'

  desktop:
    name: Desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - name: Configure Windows App SDK MSBuild tasks
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            Write-Error 'vswhere.exe was not found on this runner.'
            exit 1
          }
          $vsPath = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath)[0]
          if (-not $vsPath) {
            Write-Error 'No Visual Studio installation was found on this runner.'
            exit 1
          }
          $appx = Get-ChildItem -Path (Join-Path $vsPath 'MSBuild\Microsoft\VisualStudio') -Directory -Filter 'v*' -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'AppxPackage' } |
            Where-Object { Test-Path (Join-Path $_ 'Microsoft.Build.Packaging.Pri.Tasks.dll') } |
            Select-Object -First 1
          if (-not $appx) {
            Write-Error 'Microsoft.Build.Packaging.Pri.Tasks.dll is not present in the Visual Studio installation.'
            exit 1
          }
          "AppxMSBuildToolsPath=$appx\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "AppxMSBuildToolsPath set to $appx"
      - name: Restore
        run: dotnet restore Novara.csproj -p:RestoreLockedMode=true
      - name: Build
        run: dotnet build Novara.csproj -c Release --no-restore
      - name: Upload desktop build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: novara-desktop
          path: bin/x64/Release/*/win-x64/

  package:
    name: Package installer
    if: github.event_name == 'workflow_dispatch'
    needs: [build-test, scan, desktop]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - name: Configure Windows App SDK MSBuild tasks
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            Write-Error 'vswhere.exe was not found on this runner.'
            exit 1
          }
          $vsPath = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath)[0]
          if (-not $vsPath) {
            Write-Error 'No Visual Studio installation was found on this runner.'
            exit 1
          }
          $appx = Get-ChildItem -Path (Join-Path $vsPath 'MSBuild\Microsoft\VisualStudio') -Directory -Filter 'v*' -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'AppxPackage' } |
            Where-Object { Test-Path (Join-Path $_ 'Microsoft.Build.Packaging.Pri.Tasks.dll') } |
            Select-Object -First 1
          if (-not $appx) {
            Write-Error 'Microsoft.Build.Packaging.Pri.Tasks.dll is not present in the Visual Studio installation.'
            exit 1
          }
          "AppxMSBuildToolsPath=$appx\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "AppxMSBuildToolsPath set to $appx"
      - name: Restore
        run: dotnet restore Novara.slnx -p:RestoreLockedMode=true
      - name: Publish main app pass A
        run: >
          dotnet publish Novara.csproj -c Release -r win-x64 --self-contained
          -o ../novara-ci/pub_a
      - name: Snapshot pass A pri
        shell: pwsh
        run: |
          $pkg = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'novara-ci'
          $pri = Get-ChildItem -Path 'bin/x64/Release' -Recurse -Filter 'Novara.pri' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pri) {
            Write-Error 'Novara.pri was not produced by the build.'
            exit 1
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'pri_a') | Out-Null
          Copy-Item -Path $pri.FullName -Destination (Join-Path $pkg 'pri_a/Novara.pri') -Force
      - name: Publish main app pass B
        run: >
          dotnet publish Novara.csproj -c Release -r win-x64 --self-contained
          -o ../novara-ci/pub_b
      - name: Snapshot pass B pri
        shell: pwsh
        run: |
          $pkg = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'novara-ci'
          $pri = Get-ChildItem -Path 'bin/x64/Release' -Recurse -Filter 'Novara.pri' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pri) {
            Write-Error 'Novara.pri was not produced by the build.'
            exit 1
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'pri_b') | Out-Null
          Copy-Item -Path $pri.FullName -Destination (Join-Path $pkg 'pri_b/Novara.pri') -Force
      - name: Publish helper processes
        run: |
          dotnet publish StickNoteHost/StickNoteHost.csproj -c Release -r win-x64 --self-contained -o ../novara-ci/host
          dotnet publish NovaraMCP/NovaraMCP.csproj -c Release -r win-x64 --self-contained -o ../novara-ci/mcp
          dotnet publish Novara.Server/Novara.Server.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../novara-ci/sync
      - name: Assemble package trees
        shell: pwsh
        run: |
          $pkg = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'novara-ci'
          foreach ($pass in @('a', 'b')) {
            $stage = Join-Path $pkg "stage_$pass"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item -Path (Join-Path $pkg "pub_$pass/*") -Destination $stage -Recurse -Force
            Copy-Item -Path (Join-Path $pkg "pri_$pass/Novara.pri") -Destination (Join-Path $stage 'Novara.pri') -Force
            $hostDir = Join-Path $stage 'Host'
            New-Item -ItemType Directory -Force -Path $hostDir | Out-Null
            Copy-Item -Path (Join-Path $pkg 'host/*') -Destination $hostDir -Recurse -Force
            $hostAssets = Join-Path $hostDir 'Assets'
            New-Item -ItemType Directory -Force -Path $hostAssets | Out-Null
            Copy-Item -Path 'StickNoteHost/Assets/128.ico' -Destination (Join-Path $hostAssets '128.ico') -Force
            Copy-Item -Path (Join-Path $pkg 'mcp/NovaraMCP.exe') -Destination (Join-Path $stage 'NovaraMCP.exe') -Force
            $syncDir = Join-Path $stage 'Sync'
            New-Item -ItemType Directory -Force -Path $syncDir | Out-Null
            Copy-Item -Path (Join-Path $pkg 'sync/*') -Destination $syncDir -Recurse -Force
            Copy-Item -Path 'Installer/Sync/*.cmd' -Destination $syncDir -Force
          }
          Write-Host 'Package trees assembled.'
      - name: Compare the two package trees
        shell: pwsh
        run: |
          function Get-TreeHashes([string]$Root) {
            $base = (Resolve-Path $Root).Path
            Get-ChildItem -Path $Root -Recurse -File |
              ForEach-Object {
                [pscustomobject]@{
                  Path = $_.FullName.Substring($base.Length).TrimStart('\')
                  Hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
                }
              } |
              Sort-Object -Property Path
          }
          $pkg = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'novara-ci'
          $treeA = Get-TreeHashes (Join-Path $pkg 'stage_a')
          $treeB = Get-TreeHashes (Join-Path $pkg 'stage_b')
          $delta = Compare-Object -ReferenceObject $treeA -DifferenceObject $treeB -Property Path, Hash
          if ($delta) {
            $delta | ForEach-Object { Write-Host "$($_.SideIndicator) $($_.Path) $($_.Hash)" }
            Write-Error "Package tree mismatch: $($delta.Count) entries differ between the two publishes."
            exit 1
          }
          Write-Host "Both package trees are byte-identical: $($treeA.Count) files compared."
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: |
          $pkg = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'novara-ci'
          $publishDir = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Novara_Publish'
          if (Test-Path $publishDir) { Remove-Item -Path $publishDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          Copy-Item -Path (Join-Path $pkg 'stage_a/*') -Destination $publishDir -Recurse -Force
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem -Path 'C:\Program Files (x86)', 'C:\Program Files' -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
            if ($found) { $iscc = $found }
          }
          if (-not (Test-Path $iscc)) {
            Write-Error 'ISCC.exe was not found on this runner.'
            exit 1
          }
          Write-Host "Using $iscc"
          & $iscc 'Installer\setup.iss'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }
          $outputDir = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Novara Release'
          $installer = Get-ChildItem -Path $outputDir -Filter 'Novara_Setup_*.exe' -ErrorAction SilentlyContinue |
            Sort-Object -Property LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            Write-Error 'The installer was not produced.'
            exit 1
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA256: $((Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash)"
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          Copy-Item -Path $installer.FullName -Destination 'artifacts' -Force
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: novara-installer
          path: artifacts/Novara_Setup_*.exe
          if-no-files-found: error

  release:
    name: Release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, scan, desktop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - name: Publish sync server
        run: >
          dotnet publish Novara.Server/Novara.Server.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/sync
      - name: Upload sync server
        uses: actions/upload-artifact@v7
        with:
          name: novarasync
          path: publish/sync/NovaraSync.exe

  sign:
    name: Sign release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v4
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          for attempt in $(seq 1 40); do
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                 --pattern IMAGES.txt --pattern 'Novara_Setup_*.exe' --dir assets --clobber; then
              ls -l assets
              exit 0
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "Release assets were not available in time." >&2
              exit 1
            fi
            sleep 30
          done
      - name: Sign container image
        shell: bash
        run: |
          set -euo pipefail
          reference="$(grep -m1 '^ghcr\.io/' assets/IMAGES.txt)"
          cosign sign --yes "$reference"
      - name: Sign installer
        shell: bash
        run: |
          set -euo pipefail
          installer="$(ls assets/Novara_Setup_*.exe)"
          cosign sign-blob --yes --bundle signature.bundle "$installer"
      - name: Attach signature bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" signature.bundle --clobber
